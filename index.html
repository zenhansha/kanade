<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="KANADE">
<meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1d21" media="(prefers-color-scheme: dark)">
<title>KANADE 奏</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/Bravura.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="tbar">
      <button class="tb icon" id="btnHome" title="ホーム（楽譜の一覧・新規・開く）"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9h-6v-6H9v6H3z"/></svg></button>
      <div class="brand" id="docTitle" title="クリックでスコア情報を編集">無題</div>
      <span class="savest" id="saveState"></span>
      <nav class="rtabs" id="rbTabs" role="tablist"></nav>
      <button class="tb icon rcol" id="rbCollapse"></button>
      <div class="spacer"></div>
      <button class="tb search" id="btnSearch" title="操作や記号を検索（Ctrl+K）"><svg viewBox="0 0 24 24"><path d="M11 4a7 7 0 1 0 .1 0M21 21l-5-5"/></svg><span>検索</span></button>
      <button class="tb icon" id="btnUndo" title="元に戻す（Ctrl+Z）"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
      <button class="tb icon" id="btnRedo" title="やり直し（Ctrl+Y）"><svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
      <div class="sep"></div>
      <button class="tb icon" id="btnRewind" title="先頭へ"><svg viewBox="0 0 24 24"><path d="M6 5v14"/><path d="m18 5-9 7 9 7z" class="fill"/></svg></button>
      <button class="tb icon rec" id="btnRec" title="リアルタイム入力（HyperScribe）"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="6.5" class="fill"/></svg></button>
      <button class="tb icon play" id="btnPlay" title="再生／停止（スペース）"><svg viewBox="0 0 24 24" class="i-play"><path d="M7 4v16l13-8z" class="fill"/></svg><svg viewBox="0 0 24 24" class="i-stop"><rect x="6" y="6" width="12" height="12" rx="1.5" class="fill"/></svg></button>
      <button class="tb" id="btnTempo" title="テンポ"><span class="note-glyph"></span><span id="tempoLabel">= 100</span></button>
      <div class="sep"></div>
      <button class="tb midi" id="btnMidi" title="MIDIキーボード"><span class="dot"></span><span>MIDI</span></button>
      <button class="tb icon" id="btnFull" title="全画面"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      <button class="tb icon" id="btnHelp" title="使い方・ショートカット（F1）"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14"/><circle cx="12" cy="17.2" r=".6" class="fill"/></svg></button>
    </div>
    <div class="rpanel-wrap"><div class="rpanel" id="rbPanel"></div></div>
  </header>

  <div id="work">
    <main id="scroller" tabindex="-1">
      <div id="pages"></div>
    </main>
    <aside id="sidePanel" aria-label="記号パレット"></aside>
  </div>

  <div id="statusbar"><span id="status"></span><span id="hint"></span>
    <div class="sb-r">
      <button class="sbb" data-arr="vertical" title="ページを縦に並べる"><svg viewBox="0 0 24 24"><path d="M7 3h10v8H7zM7 13h10v8H7z"/></svg></button>
      <button class="sbb" data-arr="horizontal" title="ページを横に並べる"><svg viewBox="0 0 24 24"><path d="M2 6h9v12H2zM13 6h9v12h-9z"/></svg></button>
      <button class="sbb" data-arr="scroll" title="1段スクロール"><svg viewBox="0 0 24 24"><path d="M2 9h20v6H2z"/></svg></button>
      <span class="sbsep"></span>
      <button class="sbb" id="btnZoomOut" title="縮小"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
      <button class="sbb zl" id="zoomLabel" title="画面に合わせる">100%</button>
      <button class="sbb" id="btnZoomIn" title="拡大"><svg viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></svg></button>
    </div>
  </div>
  <div id="piano" hidden></div>
</div>
<div id="home" hidden></div>

<div id="toast" role="status"></div>
<div id="modalRoot"></div>
<input type="file" id="fileInput" accept=".kanade,.musicxml,.xml,.mxl,.mid,.midi,audio/midi,audio/x-midi,application/vnd.recordare.musicxml+xml,application/vnd.recordare.musicxml,application/xml,text/xml" hidden>

<script type="module" src="js/main.js"></script>
</body>
</html>
