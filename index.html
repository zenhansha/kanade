<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="KANADE">
<meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1d21" media="(prefers-color-scheme: dark)">
<title>KANADE 奏</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/Bravura.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <button class="tb" id="btnFile" title="ファイル">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg><span>ファイル</span>
    </button>
    <div class="brand" id="docTitle" title="タップでスコア情報を編集">無題</div>
    <div class="spacer"></div>
    <button class="tb icon" id="btnUndo" title="元に戻す（Ctrl+Z）"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
    <button class="tb icon" id="btnRedo" title="やり直し（Ctrl+Y）"><svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
    <div class="sep"></div>
    <button class="tb icon" id="btnRewind" title="先頭へ"><svg viewBox="0 0 24 24"><path d="M6 5v14"/><path d="m18 5-9 7 9 7z" class="fill"/></svg></button>
    <button class="tb icon play" id="btnPlay" title="再生／停止（スペース）"><svg viewBox="0 0 24 24" class="i-play"><path d="M7 4v16l13-8z" class="fill"/></svg><svg viewBox="0 0 24 24" class="i-stop"><rect x="6" y="6" width="12" height="12" rx="1.5" class="fill"/></svg></button>
    <button class="tb" id="btnTempo" title="テンポ"><span class="note-glyph"></span><span id="tempoLabel">= 100</span></button>
    <div class="sep"></div>
    <button class="tb" id="btnMeasure" title="小節・拍子・調・音部記号"><svg viewBox="0 0 24 24"><path d="M3 6h18M3 10h18M3 14h18M3 18h18M8 4v16M17 4v16"/></svg><span>小節</span></button>
    <button class="tb" id="btnScore" title="楽器・スコア設定"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-2.7-1.1l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.6 1.6 0 0 0 3.6 15H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.1-2.7l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.6 1.6 0 0 0 9.7 4.4V4a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 2.7 1.1l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0 1.1 2.7H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg><span>スコア</span></button>
    <button class="tb" id="btnView" title="表示（スコア / パート譜・実音 / 記譜音）"><svg viewBox="0 0 24 24"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="2.8"/></svg><span id="viewLabel">スコア</span></button>
    <div class="sep"></div>
    <div class="zoom">
      <button class="tb icon" id="btnZoomOut" title="縮小"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
      <button class="tb zl" id="zoomLabel" title="幅に合わせる">100%</button>
      <button class="tb icon" id="btnZoomIn" title="拡大"><svg viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></svg></button>
    </div>
    <button class="tb midi" id="btnMidi" title="MIDIキーボード"><span class="dot"></span><span>MIDI</span></button>
    <button class="tb icon" id="btnHelp" title="使い方・ショートカット"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14"/><circle cx="12" cy="17.2" r=".6" class="fill"/></svg></button>
  </header>

  <main id="scroller" tabindex="-1">
    <div id="pages"></div>
  </main>

  <div id="statusbar"><span id="status"></span><span id="hint"></span></div>

  <footer id="palette"></footer>
  <div id="piano" hidden></div>
</div>

<div id="toast" role="status"></div>
<div id="modalRoot"></div>
<input type="file" id="fileInput" accept=".kanade,.musicxml,.xml,.mxl,application/vnd.recordare.musicxml+xml,application/vnd.recordare.musicxml,application/xml,text/xml" hidden>

<script type="module" src="js/main.js"></script>
</body>
</html>
